name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Environment
        run: |
          python --version
          php --version
      - name: Discovery dataset gate
        run: python -m discovery.check
      - name: Discovery unit tests
        run: python -m unittest discover -s discovery/tests -t .
      - name: Tooling unit tests
        run: python -m unittest discover -s tools/tests -t .
      - name: Repository configuration checks
        run: python tools/repo_checks.py
      - name: PHP lint
        run: find mizzey-site mizzey-theme -name '*.php' -print0 | xargs -0 -r -n1 php -l

  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Scope trace (changed specs and the PR body)
        run: python tools/scope_trace.py --base "origin/${{ github.base_ref }}" --event "$GITHUB_EVENT_PATH"
      - name: House rules (added lines and added files)
        run: python tools/house_rules.py --base "origin/${{ github.base_ref }}"
