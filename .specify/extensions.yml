# Mizzey: the agent-context hooks are disabled. They rewrite CLAUDE.md after specify and plan, and CLAUDE.md here is
# a fixed pointer to AGENTS.md. Re-enable only by an approved governance change. See docs/tooling.md.
installed:
- agent-context
settings:
  auto_execute_hooks: false
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: false
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: false
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
